<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e11">
  <meta name="description" content="Genius Agenda AI — acesso protegido à sua agenda e aos seus lembretes.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Genius — sua agenda, com clareza</title>
  <link rel="icon" type="image/svg+xml" href="assets/mark.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="live.css">
  <script type="module" src="live.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
  <div id="auth-root" class="access-shell" role="main" aria-labelledby="access-title"></div>
  <div id="app-root" class="app-shell" hidden>
    <aside class="sidebar" aria-label="Navegação principal">
      <a class="brand" href="#visao-geral" aria-label="Genius, visão geral"><img class="brand-mark" src="assets/mark.svg" alt="" width="32" height="32"><span><span class="brand-name">genius<span class="brand-point">.</span></span><span class="brand-sub">AGENDA AI</span></span></a>
      <nav class="nav-list" id="navigation" aria-label="Telas do painel"></nav>
      <div class="sidebar-bottom"><a class="nav-item" href="demo/" aria-label="Ver demonstração com dados fictícios"> <span data-icon="sparkles"></span><span class="nav-label">Demonstração</span></a><button class="nav-item" data-action="logout" aria-label="Sair deste navegador"><span data-icon="logout"></span><span class="nav-label">Sair</span></button><div class="divider"></div><div class="profile"><span class="profile-avatar">G</span><div class="profile-copy"><strong>Seu espaço</strong><span id="calendar-name">Acesso local protegido</span></div></div></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="topbar-left"><span class="mobile-only mobile-wordmark">genius<span>.</span></span><span class="breadcrumb" id="breadcrumb">Visão geral</span></div><div class="topbar-right"><span class="connection-badge" id="connection-badge">Acesso autorizado</span><button class="icon-button" data-action="refresh" aria-label="Atualizar consultas"><span data-icon="refresh"></span></button><button class="icon-button mobile-only" data-action="logout" aria-label="Sair deste navegador"><span data-icon="logout"></span></button><span class="avatar desktop-only" aria-label="Área pessoal">G</span></div></header>
      <main id="main-content" class="page" tabindex="-1"></main>
      <footer class="bottom-note">Mesma agenda no WhatsApp e no painel · Você confirma cada alteração</footer>
    </div>
  </div>
  <dialog id="sheet" class="sheet-dialog" aria-labelledby="sheet-title"><div class="sheet-header"><span id="sheet-kicker" class="eyebrow">COMPROMISSO</span><button class="icon-button dialog-close" data-action="close-sheet" aria-label="Fechar detalhes"><span data-icon="x"></span></button></div><div id="sheet-content" class="sheet-body"></div><div id="sheet-footer" class="sheet-footer"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><div class="noscript-note">Ative o JavaScript para acessar o painel. Seus dados de agenda só são carregados após autorizar este navegador.</div></noscript>
</body>
</html>
